<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>粒子动画编辑器 ParticleEditor</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="./icon.png" />
  <script>
    // 首屏前写入主题，避免亮/暗色闪烁。
    (function () {
      try {
        var t = localStorage.getItem('pdraw-theme');
        document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    })();
  </script>
</head>
<body>
  <header class="topbar" data-tauri-drag-region>
    <nav class="menubar">
      <div class="menu">
        <button class="menu-btn" data-menu="file" data-i18n="menu.file">文件</button>
        <div class="dropdown" id="menu-file">
          <button id="btn-new" class="dd-item"><span data-i18n="common.new">新建</span><kbd>Ctrl+N</kbd></button>
          <button id="btn-open" class="dd-item"><span data-i18n="menu.openEllipsis">打开…</span><kbd>Ctrl+O</kbd></button>
          <button id="btn-save" class="dd-item"><span data-i18n="common.save">保存</span><kbd>Ctrl+S</kbd></button>
          <button id="btn-saveas" class="dd-item"><span data-i18n="menu.saveAs">另存为…</span></button>
          <button id="btn-export" class="dd-item"><span data-i18n="menu.exportAnim">导出动画…</span></button>
          <div class="dd-sep"></div>
          <button id="btn-clear" class="dd-item danger"><span data-i18n="menu.clear">清空</span></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" data-menu="import" data-i18n="menu.import">导入</button>
        <div class="dropdown" id="menu-import">
          <button id="btn-import-image" class="dd-item"><span data-i18n="import.image">导入图片</span></button>
          <button id="btn-import-gif" class="dd-item"><span data-i18n="import.gif">导入动图</span></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" data-menu="edit" data-i18n="menu.edit">编辑</button>
        <div class="dropdown" id="menu-edit">
          <button id="btn-undo" class="dd-item"><span data-i18n="common.undo">撤回</span><kbd>Ctrl+Z</kbd></button>
          <button id="btn-redo" class="dd-item"><span data-i18n="common.redo">重做</span><kbd>Ctrl+Y</kbd></button>
          <div class="dd-sep"></div>
          <button id="btn-selall" class="dd-item"><span data-i18n="menu.selectAll">全选</span><kbd>Ctrl+A</kbd></button>
          <button id="btn-delete-selected" class="dd-item danger"><span data-i18n="menu.deleteSelected">删除选中</span><kbd>Delete</kbd></button>
          <div class="dd-sep"></div>
          <button id="btn-group" class="dd-item"><span data-i18n="menu.group">建立组</span><kbd>Ctrl+G</kbd></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" data-menu="lang" data-i18n="menu.lang">语言</button>
        <div class="dropdown" id="menu-lang">
          <button class="dd-item" data-lang="zh">中文</button>
          <button class="dd-item" data-lang="en">English</button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" data-menu="theme" data-i18n="menu.theme">配色</button>
        <div class="dropdown" id="menu-theme">
          <button class="dd-item" data-theme="dark"><span data-i18n="theme.dark">暗色</span><span class="dd-check" id="theme-check-dark">✓</span></button>
          <button class="dd-item" data-theme="light"><span data-i18n="theme.light">亮色</span><span class="dd-check" id="theme-check-light">✓</span></button>
        </div>
      </div>
      <div class="menu">
        <button class="menu-btn" data-menu="about" id="btn-about" data-i18n="menu.about">关于</button>
      </div>
    </nav>
    <div class="mobile-top-actions">
      <button id="mobile-panel-btn" class="mobile-action-btn" data-i18n-title="mobile.panels" title="属性 / 函数 / 贴图">
        <svg viewBox="0 0 18 18"><path d="M2.5 5h13M2.5 9h13M2.5 13h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="6" cy="5" r="1.6" fill="currentColor"/><circle cx="11" cy="9" r="1.6" fill="currentColor"/><circle cx="8" cy="13" r="1.6" fill="currentColor"/></svg>
      </button>
      <button id="mobile-timeline-btn" class="mobile-action-btn" data-i18n-title="mobile.timeline" title="时间轴">
        <svg viewBox="0 0 18 18"><rect x="2" y="4" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 4v10M9 4v10M13 4v10" stroke="currentColor" stroke-width="1"/><circle cx="7" cy="9" r="1.5" fill="currentColor"/></svg>
      </button>
    </div>
    <span id="topbar-title" data-tauri-drag-region>my_animation.pdraw</span>
    <div class="titlebar-controls" id="titlebar-controls" hidden>
      <button class="tb-btn" id="tb-minimize" type="button" data-i18n-title="titlebar.minimize" title="最小化">
        <svg viewBox="0 0 10 10"><path d="M0.5 5h9" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
      </button>
      <button class="tb-btn" id="tb-maximize" type="button" data-i18n-title="titlebar.maximize" title="最大化">
        <svg class="tb-icon-max" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        <svg class="tb-icon-restore" viewBox="0 0 10 10"><path d="M2.5 2.5V0.5h7v7h-2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="0.5" y="2.5" width="7" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button class="tb-btn tb-close" id="tb-close" type="button" data-i18n-title="titlebar.close" title="关闭">
        <svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <nav class="icon-strip" id="strip-left" aria-label="Left panel icons">
      <div class="strip-half" id="strip-left-top"></div>
      <div class="strip-half" id="strip-left-bottom"></div>
    </nav>
    <section class="side-area" id="area-left">
      <div class="resize-handle-l" id="resize-handle-l"></div>
    </section>

    <section id="viewport" class="viewport">
      <canvas id="axis-gizmo"></canvas>
      <div id="box-overlay"></div>
      <div id="fps-counter" class="fps-counter">60FPS</div>
      <div class="toolbar" id="tools">
        <button class="tool active" data-tool="select" data-i18n-title="tool.select" title="选择（框选）"><svg viewBox="0 0 18 18"><path d="M4 2h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 2"/></svg></button>
        <button class="tool" data-tool="move" data-i18n-title="tool.move" title="移动"><svg viewBox="0 0 18 18"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M6 6l3-3 3 3M6 12l3 3 3-3M6 6l-3 3 3 3M12 6l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="tool" data-tool="rotate" data-i18n-title="tool.rotate" title="旋转"><svg viewBox="0 0 18 18"><path d="M14.5 9a5.5 5.5 0 1 1-1.6-3.9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M13.5 1.5v3.6h-3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="tool" data-tool="pencil" data-i18n-title="tool.pencil" title="铅笔（点按放置）"><svg viewBox="0 0 18 18"><path d="M3 15l1-4 9-9 3 3-9 9-4 1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
        <button class="tool" data-tool="line" data-i18n-title="tool.line" title="直线"><svg viewBox="0 0 18 18"><path d="M3 15L15 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button class="tool" data-tool="circle" data-i18n-title="tool.circle" title="圆"><svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <button class="tool" data-tool="rect" data-i18n-title="tool.rect" title="矩形"><svg viewBox="0 0 18 18"><rect x="3" y="4" width="12" height="10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <button class="tool" data-tool="freehand" data-i18n-title="tool.freehand" title="手绘"><svg viewBox="0 0 18 18"><path d="M2 12c2-4 4-4 3-1s-1 5-3 5 1-5 4-5 5 2 2 3-4-1-4-3 3-4 6-2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <button class="tool" data-tool="camera" data-i18n-title="tool.camera" title="新建摄像机"><svg viewBox="0 0 18 18"><path d="M2.5 5.5h3l1.2-1.5h4.6l1.2 1.5h3a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-12a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      </div>
      <div class="cam-tabs" id="camera-tabs"></div>
    </section>

    <section class="side-area" id="area-right">
      <div class="resize-handle-r" id="resize-handle-r"></div>
    </section>
    <nav class="icon-strip" id="strip-right" aria-label="Right panel icons">
      <div class="strip-half" id="strip-right-top"></div>
      <div class="strip-half" id="strip-right-bottom"></div>
    </nav>
  </main>

  <div id="panes" hidden>
    <div class="tab-pane" id="pane-props">
      <label class="row"><span data-i18n="common.color">颜色</span> <input id="prop-color" type="text" maxlength="9" spellcheck="false" value="#ffffffff" /><button id="prop-color-btn" class="color-swatch" data-i18n-title="blk.colorPicker" title="取色器"></button></label>
      <div class="row" id="prop-scale-row"><span data-i18n="props.scale">缩放</span>
        <div class="vec3">
          <div class="vec3-seg"><span>X</span><input id="prop-scale-x" type="number" min="0.05" step="0.05" value="1" /></div>
          <div class="vec3-seg"><span>Y</span><input id="prop-scale-y" type="number" min="0.05" step="0.05" value="1" /></div>
          <div class="vec3-seg" id="prop-scale-z-seg"><span>Z</span><input id="prop-scale-z" type="number" min="0.05" step="0.05" value="1" /></div>
        </div>
      </div>
      <div class="row" id="prop-pos-row"><span data-i18n="prop.pos">位置</span>
        <div class="vec3">
          <div class="vec3-seg"><input id="prop-posx" type="number" step="0.1" value="0" /></div>
          <div class="vec3-seg"><input id="prop-posy" type="number" step="0.1" value="0" /></div>
          <div class="vec3-seg"><input id="prop-posz" type="number" step="0.1" value="0" /></div>
        </div>
      </div>
      <div class="row" id="prop-spin-row"><span data-i18n="prop.spin">自转</span>
        <div class="vec3-wrap">
          <div class="vec3">
            <div class="vec3-seg"><input id="prop-spin-x" type="number" step="1" value="0" /></div>
            <div class="vec3-seg"><input id="prop-spin-y" type="number" step="1" value="0" /></div>
            <div class="vec3-seg"><input id="prop-spin-z" type="number" step="1" value="0" /></div>
          </div>
          <button id="prop-spin-space" class="spin-space-btn" type="button" data-i18n-title="spinSpace.hint" title="切换自转空间：世界 / 局部">W</button>
        </div>
      </div>
      <div class="row" id="prop-rot-row"><span data-i18n="prop.rot">公转</span>
        <div class="vec3-wrap">
          <div class="vec3">
            <div class="vec3-seg"><input id="prop-rot-x" type="number" step="1" value="0" /></div>
            <div class="vec3-seg"><input id="prop-rot-y" type="number" step="1" value="0" /></div>
            <div class="vec3-seg"><input id="prop-rot-z" type="number" step="1" value="0" /></div>
          </div>
          <button id="prop-rot-space" class="spin-space-btn" type="button" data-i18n-title="rotSpace.hint" title="切换公转空间：世界 / 局部">W</button>
        </div>
      </div>
      <div class="row"><span data-i18n="prop.center">公转中心</span>
        <div class="vec3">
          <div class="vec3-seg"><input id="prop-center-x" type="number" step="0.1" value="0" /></div>
          <div class="vec3-seg"><input id="prop-center-y" type="number" step="0.1" value="0" /></div>
          <div class="vec3-seg"><input id="prop-center-z" type="number" step="0.1" value="0" /></div>
        </div>
      </div>
      <label class="chk"><input id="prop-glow" type="checkbox" /><span data-i18n="props.glow">发光</span></label>
      <label class="row"><span data-i18n="props.light">光照等级</span> <input id="prop-light" type="range" min="0" max="15" step="1" value="15" /><span id="light-val">15</span></label>
      <label class="row"><span data-i18n="props.life">寿命(tick)</span> <input id="prop-life" type="number" min="-1" step="1" value="20" size="3" data-i18n-title="props.lifeHint" title="-1 或留空 = 无限（活到动画结束）" /></label>
    </div>

    <div class="tab-pane" id="pane-fx">
      <div class="vars-head">
        <select id="fx-preset-add"></select>
        <button id="btn-fx-preset-add" class="mini" data-i18n-title="fx.addPresetTitle" title="按预设新建函数对象">+ <span data-i18n="common.new">新建</span></button>
      </div>
      <div id="fx-panel"><p class="hint" data-i18n="fx.noSelection">选中一个函数对象以编辑属性</p></div>
    </div>

    <div class="tab-pane" id="pane-tex-editor">
      <div class="tex-editor">
        <div class="tex-tools" id="tex-tools">
          <button class="tex-tool active" data-ttool="select" data-i18n-title="tex.tool.select" title="矩形选区"><svg viewBox="0 0 18 18"><path d="M4 3h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.5 2"/></svg></button>
          <button class="tex-tool" data-ttool="selmove" data-i18n-title="tex.tool.move" title="移动选区（在选区内拖动移动内容）"><svg viewBox="0 0 18 18"><path d="M4 3h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.5 2"/><path d="M9 6v6M6 9h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          <button class="tex-tool" data-ttool="pencil" data-i18n-title="tex.tool.pencil" title="铅笔"><svg viewBox="0 0 18 18"><path d="M3.5 14.5l.8-3 8-8 2.2 2.2-8 8-3 .8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
          <button class="tex-tool" data-ttool="eraser" data-i18n-title="tex.tool.eraser" title="橡皮"><svg viewBox="0 0 18 18"><path d="M8.5 14.5L3 9l6.5-6.5 5 5L8.5 14.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 9l-1 1 4.5 4.5L12 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
          <button class="tex-tool" data-ttool="bucket" data-i18n-title="tex.tool.bucket" title="油漆桶"><svg viewBox="0 0 18 18"><path d="M4 14L2.5 9l4-4 3 3-5.5 6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.5 5L13 8.5M12 9l-1.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          <button class="tex-tool" data-ttool="picker" data-i18n-title="tex.tool.picker" title="滴管（按住 Alt 临时切换）"><svg viewBox="0 0 18 18"><path d="M13 3l2 2-6.5 6.5-2.5.5.5-2.5L13 3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4.5 13.5L2 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
          <div class="tex-tool-sep"></div>
          <button class="tex-tool" id="tex-undo" data-i18n-title="common.undo" title="撤回"><svg viewBox="0 0 18 18"><path d="M6 5l-3 3 3 3M3 8h7a4 4 0 0 1 0 8h-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button class="tex-tool" id="tex-redo" data-i18n-title="common.redo" title="重做"><svg viewBox="0 0 18 18"><path d="M12 5l3 3-3 3M15 8H8a4 4 0 0 0 0 8h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div class="tex-canvas-wrap" id="tex-canvas-wrap">
          <canvas id="tex-canvas"></canvas>
          <div class="tex-overlay" id="tex-grid"></div>
          <div class="tex-overlay" id="tex-overlay-cells"></div>
          <div class="tex-overlay" id="tex-overlay-uv"></div>
          <div class="tex-overlay" id="tex-overlay-frame"></div>
          <div class="tex-overlay" id="tex-overlay-sel"></div>
          <canvas id="tex-magnifier" class="tex-magnifier"></canvas>
          <button id="tex-color-btn" data-i18n-title="common.color" title="颜色" style="display:none"></button>
        </div>
        <button id="tex-fullscreen-btn" class="tex-fullscreen-btn" data-i18n-title="tex.fullscreen" title="全屏"><svg viewBox="0 0 18 18"><path d="M3 6V3h3M12 3h3v3M15 12v3h-3M6 15H3v-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="tex-meta" id="tex-meta">16 × 16</div>
      </div>
      <div class="tex-list" id="tex-list"></div>
      <div class="tex-io">
        <input id="tex-upload" type="file" accept=".png" hidden />
        <button id="btn-tex-upload" class="mini" data-i18n="tex.upload">上传贴图</button>
        <button id="btn-tex-new" class="mini" data-i18n="common.new">新建</button>
        <button id="btn-tex-export" class="mini" data-i18n="tex.export">导出</button>
      </div>
    </div>

    <div class="tab-pane" id="pane-uv">
      <div class="uv-panel" id="uv-panel">
        <p class="hint" data-i18n="tex.selectHint">选中对象以编辑贴图 / UV</p>
      </div>
    </div>

    <div class="tab-pane" id="pane-timeline">
      <div class="tl-controls">
        <button id="btn-play" class="btn">▶ 播放</button>
        <span class="tl-speed-group"><input id="tl-speed" type="number" min="0.1" step="0.1" value="1" /><span class="ticks">x</span></span>
        <label class="chk tl-loop"><input id="tl-loop" type="checkbox" /><span data-i18n="timeline.loop">循环</span></label>
        <button id="tl-easing" class="ease-btn" data-i18n-title="timeline.easing" title="缓动函数"></button>
        <span class="tl-time-group">
          <input id="tl-time" type="number" min="0" step="0.001" value="0" />
          <span class="ticks">s / <span id="tl-max">0</span></span>
        </span>
      </div>
      <div class="tl-body">
        <div id="tl-tree" class="tl-tree"></div>
        <div class="tl-main">
          <canvas id="timeline"></canvas>
          <canvas id="tl-layers-canvas"></canvas>
        </div>
      </div>
    </div>
  </div>

  <footer class="dock-bottom" id="dock-bottom">
    <div id="tl-module-resize" data-i18n-title="timeline.resizeTitle" title="拖拽调整时间轴模块高度"></div>
  </footer>

  <input id="file-import" type="file" accept=".pdraw,.json" hidden />
  <input id="import-file" type="file" hidden />
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
